<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Jet - Sinais VIP</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- Подключаем скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        /* Плавное вращение сканирующего луча радара */
        @keyframes radar-scan {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-radar {
            animation: radar-scan 2.5s linear infinite;
        }
        /* Фирменный размытый неоновый фон в стиле Lucky Jet */
        .neon-glow {
            box-shadow: 0 0 20px rgba(147, 51, 234, 0.4), 0 0 40px rgba(59, 130, 246, 0.25);
        }
    </style>
</head>
<body class="bg-gradient-to-b from-[#0f0b21] via-[#160f33] to-[#0a0718] text-white flex flex-col items-center justify-between min-h-screen p-4 font-sans select-none overflow-hidden">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ: Логотип и Название игры -->
    <div class="w-full flex flex-col items-center text-center mt-2">
        <div class="flex items-center space-x-2 bg-purple-950/40 border border-purple-500/30 px-3 py-1 rounded-full backdrop-blur-sm">
            <!-- SVG Иконка летящего космонавта на ракете (Lucky Jet) -->
            <svg class="w-5 h-5 text-pink-500 animate-bounce" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 12 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6zM12 4c.55 0 1 .45 1 1v1.17c1.72.44 3 2.01 3 3.83v2l2 2v1H6v-1l2-2v-2c0-1.82 1.28-3.39 3-3.83V5c0-.55.45-1 1-1z"/>
            </svg>
            <span class="text-lg font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-pink-500 to-amber-400">LUCKY JET MOD</span>
        </div>
        <p class="text-[10px] text-purple-300/60 mt-1.5 font-mono uppercase tracking-widest">AI Matrix System v4.1</p>
    </div>

    <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ: Идеальный футуристичный Радар -->
    <div class="flex flex-col items-center justify-center w-full my-auto">
        
        <!-- ЭКРАН 1: Процесс сканирования -->
        <div id="radar-screen" class="flex flex-col items-center">
            <div class="relative w-52 h-52 flex items-center justify-center bg-purple-950/20 border border-purple-500/20 rounded-full neon-glow">
                
                <!-- Круги сетки радара -->
                <div class="absolute w-40 h-40 border border-blue-500/20 rounded-full"></div>
                <div class="absolute w-26 h-26 border border-pink-500/10 rounded-full"></div>
                <div class="absolute w-14 h-14 border border-purple-500/30 rounded-full"></div>
                
                <!-- Перекрестие линий координат -->
                <div class="absolute w-full h-[1px] bg-blue-500/10"></div>
                <div class="absolute h-full w-[1px] bg-blue-500/10"></div>
                
                <!-- Вращающийся неоновый луч сканера -->
                <div class="absolute inset-0 rounded-full border border-transparent border-t-pink-500 border-l-blue-500/40 animate-radar"></div>
                
                <!-- Светящаяся фигурка Космонавта в самом центре радара -->
                <div class="relative z-10 w-14 h-14 flex items-center justify-center bg-gradient-to-tr from-purple-600 to-pink-600 rounded-full shadow-[0_0_15px_#d946ef]">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.656 48.656 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7C4.547 9.547 4.5 10.768 4.5 12s.047 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.092-1.209.138-2.43.138-3.662z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z" />
                    </svg>
                </div>
            </div>
            <!-- Пульсирующий текст загрузки -->
            <div class="mt-6 flex items-center space-x-2 text-blue-400 font-mono text-xs tracking-wide bg-blue-950/50 px-3 py-1.5 rounded-xl border border-blue-500/20 animate-pulse">
                <span class="w-1.5 h-1.5 bg-blue-400 rounded-full"></span>
                <span>CONECTANDO AO SERVIDOR...</span>
            </div>
        </div>

        <!-- ЭКРАН 2: Результат взлома (Коэффициент) -->
        <div id="result-screen" class="hidden w-full max-w-xs flex flex-col items-center">
            <div class="w-full bg-gradient-to-b from-[#1c1444] to-[#120c30] border-2 border-purple-500/40 rounded-2xl p-5 text-center shadow-[0_0_30px_rgba(168,85,247,0.25)] relative">
                
                <!-- Плашка статуса -->
                <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-900 font-black text-[9px] uppercase tracking-widest px-3 py-0.5 rounded-full shadow-md shadow-emerald-950/50">
                    Sinal Confirmado
                </div>
                
                <!-- Числовой Коэффициент -->
                <div id="odds-value" class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white via-slate-100 to-purple-300 tracking-tighter my-4 drop-shadow-[0_4px_8px_rgba(0,0,0,0.5)]">
                    --
                </div>
                
                <p class="text-[10px] text-purple-200/60 font-medium px-1 leading-normal mb-4">
                    🎯 Brecha identificada. Entre na rodada agora e retire no valor acima!
                </p>
                
                <!-- Исправленная компактная кнопка перехода на 1win -->
                <a id="play-btn" href="https://lkmh.cc" target="_blank" class="block w-full bg-gradient-to-r from-amber-400 via-orange-500 to-pink-500 text-slate-950 font-black py-3 rounded-xl shadow-md hover:brightness-110 active:scale-95 transition-all text-xs uppercase tracking-wider">
                    📱 JOGAR NO 1WIN
                </a>
            </div>
            
            <!-- Исправленная кнопка запроса нового коэффициента -->
            <button onclick="generateSignal()" class="mt-4 flex items-center space-x-1.5 text-[10px] text-purple-400/80 hover:text-white font-mono bg-purple-950/30 px-3 py-1.5 rounded-lg border border-purple-500/10">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                <span>GERAR PRÓXIMO SINAL</span>
            </button>
        </div>

    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ: Безопасность -->
    <div class="w-full text-center mb-2">
        <p class="text-[9px] text-purple-400/30 font-mono">🔒 SSL ENCRYPTED CONNECTION SECURE</p>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.expand();
            if (tg.ready) tg.ready();
        }

        // Логика распределения коэффициентов
        const def_generate_odds = () => {
            let chance = Math.floor(Math.random() * 100) + 1;
            if (chance <= 10) return (Math.random() * (1.20 - 1.01) + 1.01).toFixed(2);
            if (chance <= 75) return (Math.random() * (2.20 - 1.30) + 1.30).toFixed(2);
            if (chance <= 93) return (Math.random() * (4.50 - 2.21) + 2.21).toFixed(2);
            return (Math.random() * (10.50 - 4.51) + 4.51).toFixed(2);
        }

        function generateSignal() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('radar-screen').classList.remove('hidden');

            setTimeout(() => {
                const odds = def_generate_odds();
                document.getElementById('odds-value').innerText = odds + 'x';
                document.getElementById('radar-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }, 3500); 
        }

        window.onload = generateSignal;
    </script>
</body>
</html>
