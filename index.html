<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LUCKY JET - AI CORE BYPASS</title>
    <script src="https://telegram.org"></script>
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ ХАКЕРСКОГО КОСМОСА */
        body {
            background: radial-gradient(circle at center, #0f0826 0%, #04020a 100%);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* МАТРИЧНЫЙ ХАКЕРСКИЙ ФОН */
        .matrix-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0, 255, 128, 0.03) 50%, rgba(0, 0, 0, 0) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 6px 100%;
            opacity: 0.8;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .header {
            text-align: center;
            margin-top: 5px;
        }

        .brand-title {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(to right, #38bdf8, #ec4899, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 8px;
            color: #00ff88;
            letter-spacing: 2px;
            margin-top: 3px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,255,136,0.5);
        }

        /* ТЕРМИНАЛ ЛОГОВ (НАСТОЯЩИЙ ВЗЛОМ) */
        .logs-box {
            font-size: 8px;
            color: rgba(56, 189, 248, 0.6);
            width: 220px;
            height: 35px;
            overflow: hidden;
            text-align: left;
            background: rgba(0,0,0,0.4);
            padding: 4px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            margin-bottom: -15px;
        }

        /* КРУГОВОЙ РАДАР С ЛЕТЯЩЕЙ РАКЕТОЙ */
        .radar-box {
            position: relative;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-scanner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top: 3px solid #00ff88;
            border-left: 2px solid rgba(56, 189, 248, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            animation: spin 1.5s linear infinite;
        }

        .radar-grid {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 1px dashed rgba(56, 189, 248, 0.2);
            border-radius: 50%;
        }

        /* Центральный круг с летящей ракетой */
        .logo-center {
            position: relative;
            z-index: 5;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #1e1145 0%, #3b072e 100%);
            border: 1px solid #db2777;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.5);
        }

        /* Иконка летящей вверх-вправо ракеты */
        .rocket-icon {
            width: 26px;
            height: 26px;
            color: #ff007f;
            filter: drop-shadow(0 0 5px #ff007f);
            animation: fly 2s ease-in-out infinite;
        }

        /* КАРТОЧКА СИГНАЛА */
        .card {
            background: linear-gradient(180deg, #110b29 0%, #05030f 100%);
            border: 1px solid #00ff88;
            border-radius: 14px;
            padding: 14px;
            width: 230px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            box-sizing: border-box;
        }

        .badge {
            display: inline-block;
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-color: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 4px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        /* НЕОНОВЫЕ КРАСИВЫЕ ЦИФРЫ ВЗЛОМА */
        .odds-text {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            margin: 2px 0;
            letter-spacing: -1px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px #00ff88, 0 0 30px #00ff88;
        }

        .info-p {
            font-size: 10px;
            color: #94a3b8;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }

        /* КНОПКА КРАСИВОГО ВИДА С ЖЕСТКИМ РАЗМЕРОМ */
        .btn-play {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 36px;
            background: linear-gradient(90deg, #00ff88 0%, #38bdf8 100%);
            color: #05030f;
            font-weight: 900;
            font-size: 11px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 6px;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .btn-refresh {
            background: rgba(0, 255, 136, 0.05);
            border: 1px solid rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .status-box {
            font-size: 10px;
            color: #00ff88;
            font-weight: 700;
            background: rgba(0, 255, 136, 0.05);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            letter-spacing: 1px;
        }

        .footer {
            font-size: 7px;
            color: rgba(56, 189, 248, 0.2);
            margin-bottom: 5px;
        }

        .hidden { display: none !important; }

        /* АНИМАЦИИ */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fly {
            0% { transform: translate(0px, 0px); }
            50% { transform: translate(2px, -3px); }
            100% { transform: translate(0px, 0px); }
        }
    </style>
</head>
<body>

    <div class="matrix-bg"></div>

    <div class="container">
        
        <!-- ВЕРХ -->
        <div class="header">
            <h1 class="brand-title">LUCKY JET MOD</h1>
            <div class="subtitle">AI CORE BYPASS DETECTED</div>
        </div>

        <!-- ТЕРМИНАЛ ЛОГОВ -->
        <div id="logs-screen" class="logs-box">
            <div id="log-line">> Connecting to 1win server...</div>
        </div>

        <!-- ЦЕНТР: ЭКРАН ЗАГРУЗКИ (РАДАР С РАКЕТОЙ) -->
        <div id="radar-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0;">
            <div class="radar-box">
                <div class="radar-scanner"></div>
                <div class="radar-grid"></div>
                <div class="logo-center">
                    <!-- SVG Летящая ракета -->
                    <svg class="rocket-icon" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M13.13 22.14L12 24l-1.13-1.86L9 22l.53-2.07H14.5L15 22l-1.87.14M12 2C6.5 6.18 5.61 11.23 6 16.32L4.67 19h14.66L18 16.32C18.39 11.23 17.5 6.18 12 2m0 11.5c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    </svg>
                </div>
            </div>
            <div class="status-box" style="margin-top: 15px;">BYPASSING SERVER...</div>
        </div>

        <!-- ЦЕНТР: ЭКРАН С РЕЗУЛЬТАТОМ -->
        <div id="result-screen" class="hidden" style="margin: auto 0;">
            <div class="card">
                <div class="badge">SIGNAL INJECTED</div>
                <div id="odds-value" class="odds-text">--</div>
                <p class="info-p">Take your bet right now and cash out on target!</p>
                <a id="play-btn" href="https://lkmh.cc" target="_blank" class="btn-play">
                    📱 OPEN 1WIN GAME
                </a>
            </div>
            <div style="text-align:center;">
                <button onclick="generateSignal()" class="btn-refresh">
                    🔄 INJECT NEXT SIGNAL
                </button>
            </div>
        </div>

        <!-- НИЗ -->
        <div class="footer">BYPASS STATUS: ACTIVE // PACKETS: SECURE</div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg && tg.expand) {
            tg.expand();
        }
        // Логи хакерской атаки для реализма
        const hackingLogs = [
"> Injecting exploit...",
"> Bypassing anti-cheat...",
"> Fetching next multiplier...",
"> Signal decrypted successfully!"
];
const def_generate_odds = () => {
let chance = Math.floor(Math.random() * 100) + 1;
if (chance <= 10) return (Math.random() * (1.20 - 1.01) + 1.01).toFixed(2);
if (chance <= 75) return (Math.random() * (2.20 - 1.30) + 1.30).toFixed(2);
if (chance <= 93) return (Math.random() * (4.50 - 2.21) + 2.21).toFixed(2);
return (Math.random() * (10.50 - 4.51) + 4.51).toFixed(2);
}
function generateSignal() {
document.getElementById('result-screen').classList.add('hidden');
document.getElementById('radar-screen').style.display = 'flex';
// Запуск бегущих логов взлома
let logIndex = 0;
const logElement = document.getElementById('log-line');
logElement.innerText = "> Initializing core hack...";
const logInterval = setInterval(() => {
if(logIndex < hackingLogs.length) {
logElement.innerText = hackingLogs[logIndex];
logIndex++;
}
}, 700);
// Остановка радара ровно через 3 секунды
setTimeout(() => {
clearInterval(logInterval);
const odds = def_generate_odds();
document.getElementById('odds-value').innerText = odds + 'x';
document.getElementById('radar-screen').style.display = 'none';
document.getElementById('result-screen').classList.remove('hidden');
if (tg && tg.HapticFeedback) {
tg.HapticFeedback.notificationOccurred('success');
}
}, 3000);
}
window.onload = generateSignal;
