<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Jet - AI Hacker</title>
    <!-- ИСПРАВЛЕНО: Правильная ссылка на скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
        /* БАЗОВЫЕ НАСТРОЙКИ КОСМОСА */
        body {
            background: radial-gradient(circle at center, #1a103c 0%, #0b071e 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        /* МЕРЦАЮЩИЕ ЗВЕЗДЫ НА ФОНЕ */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 0), radial-gradient(rgba(255,255,255,0.3) 1px, transparent 0);
            background-size: 40px 40px, 90px 90px;
            background-position: 0 0, 20px 20px;
            opacity: 0.25;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ С ИМЕНЕМ ИГРЫ */
        .header {
            text-align: center;
            margin-top: 10px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #60a5fa, #f472b6, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 9px;
            color: rgba(168, 85, 247, 0.6);
            letter-spacing: 2px;
            margin-top: 4px;
            font-family: monospace;
        }

        /* КОСМИЧЕСКИЙ КРУГОВОЙ РАДАР */
        .radar-box {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Крутящаяся вокруг логотипа линия */
        .radar-scanner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-top: 3px solid #ff007f;
            border-left: 2px solid rgba(0, 191, 255, 0.4);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            animation: spin 1.8s linear infinite;
        }

        .radar-grid {
            position: absolute;
            width: 80%;
            height: 80%;
            border: 1px solid rgba(147, 51, 234, 0.2);
            border-radius: 50%;
        }

        /* Центральный круг с векторным логотипом космонавта */
        .logo-center {
            position: relative;
            z-index: 5;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(219, 39, 119, 0.6);
            animation: float 3s ease-in-out infinite;
        }

        /* КИБЕРПАНК КАРТОЧКА СИГНАЛА (ИСПРАВЛЕНО: Строгая аккуратная ширина) */
        .card {
            background: linear-gradient(180deg, #18113c 0%, #0e0a26 100%);
            border: 1px solid rgba(147, 51, 234, 0.4);
            border-radius: 16px;
            padding: 16px;
            width: 240px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 20px rgba(147, 51, 234, 0.15);
            box-sizing: border-box;
        }

        .badge {
            display: inline-block;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-color: rgba(52, 211, 153, 0.15);
            color: #34d399;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 6px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        /* НЕОНОВЫЕ КРАСИВЫЕ ЦИФРЫ КОЭФФИЦИЕНТА */
        .odds-text {
            font-size: 46px;
            font-weight: 900;
            color: #ffffff;
            margin: 4px 0;
            letter-spacing: -1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 20px rgba(147, 51, 234, 0.5);
        }

        .info-p {
            font-size: 11px;
            color: #a78bfa;
            margin: 0 0 12px 0;
            opacity: 0.8;
            line-height: 1.3;
        }

        /* КНОПКА С ЖЕСТКОЙ ВЫСОТОЙ (НЕ БУДЕТ РАЗДУВАТЬСЯ) */
        .btn-play {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 38px;
            background: linear-gradient(90deg, #fbbf24 0%, #f59e0b 50%, #ea580c 100%);
            color: #05030f;
            font-weight: 900;
            font-size: 12px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 8px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .btn-refresh {
            background: rgba(147, 51, 234, 0.1);
            border: 1px solid rgba(147, 51, 234, 0.2);
            color: #c084fc;
            padding: 5px 14px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-box {
            font-size: 11px;
            color: #60a5fa;
            font-weight: 700;
            font-family: monospace;
            background: rgba(30, 58, 138, 0.3);
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid rgba(96, 165, 250, 0.2);
            letter-spacing: 1px;
        }

        .footer {
            font-size: 8px;
            color: rgba(147, 51, 234, 0.2);
            font-family: monospace;
            margin-bottom: 10px;
        }

        .hidden { display: none !important; }

        /* АНИМАЦИИ */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        
        <!-- ВЕРХ -->
        <div class="header">
            <h1 class="brand-title">Lucky Jet Mod</h1>
            <div class="subtitle">AI MATRIX SYSTEM v4.1</div>
        </div>

        <!-- ЦЕНТР: ЭКРАН ЗАГРУЗКИ (РАДАР) -->
        <div id="radar-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0;">
            <div class="radar-box">
                <div class="radar-scanner"></div>
                <div class="radar-grid"></div>
                <!-- Логотип Космонавта (ИСПРАВЛЕНО: Вектор отцентрирован) -->
                <div class="logo-center">
                    <svg class="text-white" fill="currentColor" viewBox="0 0 24 24" style="width:28px; height:28px;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 12 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6zM12 4c.55 0 1 .45 1 1v1.17c1.72.44 3 2.01 3 3.83v2l2 v1H6v-1l2-2v-2c0-1.82 1.28-3.39 3-3.83V5c0-.55.45-1 1-1z"/>
                    </svg>
                </div>
            </div>
            <div class="status-box" style="margin-top: 20px;">CONECTANDO...</div>
        </div>

        <!-- ЦЕНТР: ЭКРАН С РЕЗУЛЬТАТОМ (ИСПРАВЛЕНО: Всё на месте) -->
        <div id="result-screen" class="hidden" style="margin: auto 0;">
            <div class="card">
                <div class="badge">Sinal Confirmado</div>
                <div id="odds-value" class="odds-text">--</div>
                <p class="info-p">O algoritmo identificou a brecha. Entre na rodada agora!</p>
                <a id="play-btn" href="https://lkmh.cc" target="_blank" class="btn-play">
                    📱 JOGAR NO 1WIN
                </a>
            </div>
            <div style="text-align:center;">
                <button onclick="generateSignal()" class="btn-refresh">
                    🔄 RE-ESCANEAR
                </button>
            </div>
        </div>

        <!-- НИЗ -->
        <div class="footer">🔒 SSL SECURE SYSTEM LINK</div>

    </div>

    <!-- ИСПРАВЛЕНО: Добавлен потерянный скрипт логики работы приложения -->
    <script>
        const tg = window.Telegram.WebApp;
        if (tg && tg.expand) {
            tg.expand();
        }

        const def_generate_odds = () => {
            let chance = Math.floor(Math.random() * 100) + 1;
            if (chance <= 10) return (Math.random() * (1.20 - 1.01) + 1.01).toFixed(2);
            if (chance <= 75) return (Math.random() * (2.20 - 1.30) + 1.30).toFixed(2);
            if (chance <= 93) return (Math.random() * (4.50 - 2.21) + 2.21).toFixed(2);
return (Math.random() * (10.50 - 4.51) + 4.51).toFixed(2);
}
function generateSignal() {
document.getElementById('result-screen').classList.add('hidden');
document.getElementById('radar-screen').style.display = 'flex';
setTimeout(() => {
const odds = def_generate_odds();
document.getElementById('odds-value').innerText = odds + 'x';
document.getElementById('radar-screen').style.display = 'none';
document.getElementById('result-screen').classList.remove('hidden');
if (tg && tg.HapticFeedback) {
tg.HapticFeedback.notificationOccurred('success');
}
}, 3000);
}
window.onload = generateSignal;
