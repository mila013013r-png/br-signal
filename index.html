<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sinais VIP</title>
    <script src="https://telegram.org"></script>
    <style>
        /* Чистый CSS: гарантирует одинаковый размер на всех смартфонах */
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-h-screen: 100vh;
            height: 95vh;
            box-sizing: border-box;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fbbf24;
            margin: 0 0 4px 0;
        }

        .header p {
            font-size: 12px;
            color: #94a3b8;
            margin: 0;
        }

        /* Жестко фиксированный размер радара в пикселях */
        .radar-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .circle-outer {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(245, 158, 11, 0.3);
            border-radius: 50%;
        }

        .circle-radar {
            position: absolute;
            width: 90%;
            height: 90%;
            border: 4px solid transparent;
            border-top-color: #f59e0b;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        .center-dot {
            width: 16px;
            height: 16px;
            background-color: #f59e0b;
            border-radius: 50%;
            box-shadow: 0 0 12px #f59e0b;
        }

        .status-text {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 600;
            text-align: center;
        }

        /* Карточка с результатом */
        .card {
            background-color: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            width: 240px; /* Жесткая ширина карточки */
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .badge {
            display: inline-block;
            font-size: 10px;
            text-transform: uppercase;
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 12px;
        }

        .odds {
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
            margin: 10px 0;
        }

        .card-p {
            font-size: 11px;
            color: #94a3b8;
            margin: 0 0 16px 0;
            line-height: 1.4;
        }

        /* Кнопка перехода на 1win с жесткой высотой */
        .btn-play {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 40px;
            background: linear-gradient(to right, #f59e0b, #ea580c);
            color: #0f172a;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(234, 88, 12, 0.3);
        }

        /* Кнопка обновления */
        .btn-refresh {
            background: none;
            border: none;
            color: #94a3b8;
            text-decoration: underline;
            font-size: 11px;
            margin-top: 16px;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ HACKER ALGORITMO</h1>
        <p>Analisando a matriz do jogo em tempo real...</p>
    </div>

    <!-- ЭКРАН С КРУТИЛКОЙ -->
    <div id="radar-screen" style="display: flex; flex-direction: column; align-items: center;">
        <div class="radar-wrapper">
            <div class="circle-outer"></div>
            <div class="circle-radar"></div>
            <div class="center-dot"></div>
        </div>
        <div class="status-text">Buscando sinal estável...</div>
    </div>

    <!-- ЭКРАН С РЕЗУЛЬТАТОМ -->
    <div id="result-screen" class="hidden">
        <div class="card">
            <div class="badge">Sinal Confirmado</div>
            <div id="odds-value" class="odds">--</div>
            <p class="card-p">🟢 Entre na rodada agora e retire antes do limite!</p>
            <a id="play-btn" href="https://lkmh.cc" target="_blank" class="btn-play">
                📱 Jogar no 1win
            </a>
        </div>
        <button onclick="generateSignal()" class="btn-refresh">
            🔄 Gerar nova previsão
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg && tg.expand) {
            tg.expand();
        }

        const def_generate_odds = () => {
            let chance = Math.floor(Math.random() * 100) + 1;
            if (chance <= 10) return (Math.random() * (1.20 - 1.01) + 1.01).toFixed(2);
            if (chance <= 75) return (Math.random() * (2.20 - 1.30) + 1.30).toFixed(2);
            if (chance <= 93) return (Math.random() * (4.50 - 2.21) + 2.21).toFixed(2);
            return (Math.random() * (10.50 - 4.51) + 4.51).toFixed(2);
        }

        function generateSignal() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('radar-screen').style.display = 'flex';

            setTimeout(() => {
                const odds = def_generate_odds();
                document.getElementById('odds-value').innerText = odds + 'x';
                document.getElementById('radar-screen').style.display = 'none';
                document.getElementById('result-screen').classList.remove('hidden');
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }, 3000); 
        }

        window.onload = generateSignal;
    </script>
</body>
</html>
