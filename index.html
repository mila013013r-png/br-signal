<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinais Oficiais</title>
    <!-- Подключаем Tailwind CSS для стилизации -->
    <script src="https://tailwindcss.com"></script>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org"></script>
    <style>
        /* Анимация вращения круга */
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 2s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-center min-h-screen p-4 font-sans select-none">

    <!-- Заголовок -->
    <div class="text-center mb-8">
        <h1 class="text-2xl font-black tracking-wider text-amber-400">⚡ HACKER ALGORITMO</h1>
        <p class="text-sm text-slate-400 mt-1">Analisando a matriz do jogo em tempo real...</p>
    </div>

    <!-- ЭКРАН 1: Крутящийся радар / Сканирование -->
    <div id="radar-screen" class="flex flex-col items-center justify-center">
        <div class="relative w-48 h-48 flex items-center justify-center">
            <!-- Внешний светящийся пульсирующий круг -->
            <div class="absolute inset-0 rounded-full border-2 border-dashed border-amber-500/30 animate-pulse"></div>
            <!-- Вращающийся внутренний радар -->
            <div class="absolute inset-2 rounded-full border-4 border-t-amber-500 border-r-transparent border-b-transparent border-l-transparent animate-spin-slow"></div>
            <!-- Central точка -->
            <div class="w-4 h-4 bg-amber-500 rounded-full shadow-[0_0_15px_#f59e0b]"></div>
        </div>
        <p class="mt-6 text-base font-semibold text-slate-300 animate-bounce">Buscando sinal estável...</p>
    </div>

    <!-- ЭКРАН 2: Показ готового коэффициента (изначально скрыт) -->
    <div id="result-screen" class="hidden flex flex-col items-center justify-center text-center">
        <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 shadow-2xl max-w-xs w-full">
            <span class="text-xs uppercase bg-emerald-500/20 text-emerald-400 font-bold px-3 py-1 rounded-full">Sinal Confirmado</span>
            
            <!-- Сюда скрипт подставит число -->
            <div id="odds-value" class="text-5xl font-black my-5 text-white tracking-tight">--</div>
            
            <p class="text-xs text-slate-400 mb-4">🟢 Entre na rodada agora e retire antes do limite!</p>
            
            <!-- Кнопка действия -->
            <a id="play-btn" href="https://lkmh.cc" target="_blank" class="block w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-900 font-bold py-3 rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all text-sm uppercase tracking-wider">
                📱 Jogar no 1win
            </a>
        </div>
        
        <!-- Кнопка "Получить новый сигнал" -->
        <button onclick="generateSignal()" class="mt-6 text-xs text-slate-400 underline decoration-dotted hover:text-white">
            🔄 Gerar nova previsão
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp API
        const tg = window.Telegram.WebApp;
        if (tg && tg.expand) {
            tg.expand(); // Расширяем приложение на весь экран смартфона
        }

        // Алгоритм генерации коэффициентов (копия вашей логики из бота)
        const def_generate_odds = () => {
            let chance = Math.floor(Math.random() * 100) + 1;
            if (chance <= 10) return (Math.random() * (1.20 - 1.01) + 1.01).toFixed(2);
            if (chance <= 75) return (Math.random() * (2.20 - 1.30) + 1.30).toFixed(2);
            if (chance <= 93) return (Math.random() * (4.50 - 2.21) + 2.21).toFixed(2);
            return (Math.random() * (10.50 - 4.51) + 4.51).toFixed(2);
        }

        function generateSignal() {
            // Переключаемся обратно на экран радара
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('radar-screen').classList.remove('hidden');

            // Имитируем «процесс взлома» длительностью 3 секунды
            setTimeout(() => {
                const odds = def_generate_odds();
                
                // Подставляем значение в интерфейс
                document.getElementById('odds-value').innerText = odds + 'x';
                
                // Прячем радар, показываем результат
                document.getElementById('radar-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                
                // Небольшая вибрация телефона
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }, 3000); 
        }

        // Запускаем генерацию сразу при открытии приложения
        window.onload = generateSignal;
    </script>
</body>
</html>
